<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon for the "Save Log" buttons. The WPF build uses log.png, which is this
  file rendered at 240x240 so that it matches the resolution of github-mark.png.
  Keep both files in sync when editing.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <g fill="none" stroke="#24292F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- page with a folded top-right corner -->
    <path d="M6.25 2.75h7.25L18.75 8v13.25H6.25z"/>
    <path d="M13.5 2.75V8h5.25"/>
    <!-- text lines -->
    <path d="M9 12.5h6.5"/>
    <path d="M9 15.75h6.5"/>
    <path d="M9 19h4"/>
  </g>
</svg>
